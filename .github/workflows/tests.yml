name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly health check so the badge reflects current reality,
    # not just the last push (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  HEADLESS: "true"

jobs:
  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
      QA_RUN_LABEL: ui-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI suite (parallel)
        run: pytest -m "not api and not defect" -n auto

      - name: Publish job summary
        if: always()
        run: python .github/scripts/ci_summary.py "UI tests (${{ matrix.browser }})"

      - name: Upload the run (report, evidence, videos)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-ui-${{ matrix.browser }}
          path: test_results/
          if-no-files-found: warn

  framework-tests:
    name: Framework unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No browser needed: these check the recorder, the run record and the
      # report builder, which is the part nobody would notice breaking.
      - name: Run the framework unit tests
        # Set on the step, not the job: the runner context reaches steps only.
        env:
          QA_RESULTS_DIR: ${{ runner.temp }}/framework-run
        run: pytest framework/tests -q

  # Non-blocking: this job asserts that SauceDemo's seeded broken builds are
  # still broken. A failure here means a pinned defect no longer reproduces,
  # which is a signal to promote its check, not a reason to block a merge.
  defect-scan:
    name: Defect scan (documented defects, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      QA_RUN_LABEL: defects
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run the defect suite
        run: pytest -m defect

      - name: Publish job summary
        if: always()
        run: python .github/scripts/ci_summary.py "Defect scan (documented defects)"

      - name: Upload the run (report, evidence, videos)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-defects
          path: test_results/
          if-no-files-found: warn

  # Non-blocking: restful-booker is a third-party sandbox with occasional
  # outages outside this repo's control.
  api-tests:
    name: API tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      QA_RUN_LABEL: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the API suite
        run: pytest -m api

      - name: Publish job summary
        if: always()
        run: python .github/scripts/ci_summary.py "API tests"

      - name: Upload the run (report and summary)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-api
          path: test_results/
          if-no-files-found: warn
