[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output configuration
addopts = -v --tb=short --strict-markers

# Custom markers for test categorization
markers =
    smoke: critical-path checks, fast enough for every commit
    regression: full functional coverage, run before every release
    baseline: readings taken before the run acts on anything
    functional: UI functional tests
    e2e: end-to-end user journeys
    api: HTTP API tests (no browser required)
    verification: results checked somewhere other than where they were made
    defect: documented defects, pinned against the deliberately broken builds
